<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Unofficial live timing board for NASCAR sessions." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Spotter · NASCAR Live Timing</title>
    <script>
      // Apply a saved light theme before first paint (see src/prefs/store.ts).
      try {
        var saved = JSON.parse(localStorage.getItem('spotter.preferences.v1') || '{}');
        if (saved.theme === 'light') document.documentElement.dataset.theme = 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
